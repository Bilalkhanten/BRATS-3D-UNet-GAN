name: CI

# Pipeline graph (arrows are `needs:`):
#
#   lint ───────────┐
#                   ├──▶ unit-tests (3.10, 3.12) ──▶ smoke ──▶ docker-image
#   build-package ──┘
#
# "Run workflow" on the Actions tab starts it by hand (workflow_dispatch).

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Ruff
        run: |
          python -m pip install --upgrade pip ruff
          ruff check bratsgan tests scripts examples

  build-package:
    name: build-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  unit-tests:
    name: unit-tests (${{ matrix.python-version }})
    needs: [lint, build-package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -m "not slow"

  smoke:
    name: smoke
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"
      - name: End-to-end test on synthetic phantoms
        run: bash scripts/smoke_test.sh

  docker-image:
    name: docker-image
    needs: [smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU image (not pushed)
        run: docker build -t bratsgan:ci .
      - name: CLI runs inside the image
        run: docker run --rm bratsgan:ci bratsgan --help
